name: plos-revision-figures

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/generate_plos_revision_figures.py'
      - '.github/workflows/plos-revision-figures.yml'

jobs:
  figures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install plotting dependency
        run: python -m pip install matplotlib
      - name: Render revised figures and aggregate tables
        run: |
          python tools/generate_plos_revision_figures.py
          echo "--- LATEX OUTPUT ---"
          cat report/revised_figures/tables_revision.tex
      - uses: actions/upload-artifact@v4
        with:
          name: plos-revision-figures-and-tables
          path: report/revised_figures/
